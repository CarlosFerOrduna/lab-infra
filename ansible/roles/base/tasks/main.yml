- name: Create the automation user
  ansible.builtin.user:
      name: ansible
      shell: /bin/bash
      create_home: true

- name: Authorize the automation key
  ansible.posix.authorized_key:
      user: ansible
      key: "{{ automation_public_key }}"
      exclusive: true

- name: Allow the automation user to use sudo without a password
  ansible.builtin.copy:
      dest: /etc/sudoers.d/ansible
      content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
      owner: root
      group: root
      mode: "0440"
      validate: /usr/sbin/visudo -cf %s

- name: Set the hostname from the inventory
  ansible.builtin.hostname:
      name: "{{ inventory_hostname }}"

- name: Install the base packages
  ansible.builtin.apt:
      name:
          - curl
          - ca-certificates
          - jq
      state: present
      update_cache: true
      cache_valid_time: 3600

- name: Keep security updates enabled
  ansible.builtin.apt:
      name: unattended-upgrades
      state: present

- name: Keep the security updates service running
  ansible.builtin.service:
      name: unattended-upgrades
      enabled: true
      state: started
