- name: Create the automation user
  ansible.builtin.user:
      name: ansible
      shell: /bin/bash
      create_home: true

- name: Authorize the automation key
  ansible.posix.authorized_key:
      user: ansible
      key: "{{ automation_public_key }}"
      exclusive: true

- name: Allow the automation user to use sudo without a password
  ansible.builtin.copy:
      dest: /etc/sudoers.d/ansible
      content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
      owner: root
      group: root
      mode: "0440"
      validate: /usr/sbin/visudo -cf %s

- name: Set the hostname from the inventory
  ansible.builtin.hostname:
      name: "{{ inventory_hostname }}"

- name: Resolve the hostname locally
  ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^127\.0\.1\.1\s'
      line: "127.0.1.1 {{ inventory_hostname }}"

- name: Install the base packages
  ansible.builtin.apt:
      name:
          - curl
          - ca-certificates
          - jq
      state: present
      update_cache: true
      cache_valid_time: 3600

- name: Keep security updates enabled
  ansible.builtin.apt:
      name: unattended-upgrades
      state: present

- name: Keep the security updates service running
  ansible.builtin.service:
      name: unattended-upgrades
      enabled: true
      state: started

- name: Turn off swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0

- name: Keep swap off after reboots
  ansible.builtin.replace:
      path: /etc/fstab
      regexp: '^([^#].*\sswap\s.*)$'
      replace: '# \1'

- name: Remove the swap file
  ansible.builtin.file:
      path: /swap.img
      state: absent

- name: Load the kernel modules at boot
  ansible.builtin.copy:
      dest: /etc/modules-load.d/kubernetes.conf
      content: "overlay\nbr_netfilter\n"
      owner: root
      group: root
      mode: "0644"

- name: Load the kernel modules now
  community.general.modprobe:
      name: "{{ item }}"
      state: present
  loop:
      - overlay
      - br_netfilter

- name: Set the kernel parameters for Kubernetes networking
  ansible.posix.sysctl:
      name: "{{ item }}"
      value: "1"
      sysctl_file: /etc/sysctl.d/99-kubernetes.conf
      reload: true
  loop:
      - net.bridge.bridge-nf-call-iptables
      - net.bridge.bridge-nf-call-ip6tables
      - net.ipv4.ip_forward

- name: Install the firewall
  ansible.builtin.apt:
      name: ufw
      state: present

- name: Allow SSH
  community.general.ufw:
      rule: allow
      port: "22"
      proto: tcp

- name: Allow the Kubernetes API
  community.general.ufw:
      rule: allow
      port: "6443"
      proto: tcp

- name: Allow traffic from the pod and service networks
  community.general.ufw:
      rule: allow
      src: "{{ item }}"
  loop:
      - 10.42.0.0/16
      - 10.43.0.0/16

- name: Deny incoming traffic by default and enable the firewall
  community.general.ufw:
      state: enabled
      default: deny
      direction: incoming
