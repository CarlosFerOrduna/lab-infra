- name: Create the operator user
  ansible.builtin.user:
      name: "{{ bastion_user }}"
      shell: /bin/bash
      create_home: true
  register: bastion_user_account

- name: Authorize the operator key
  ansible.posix.authorized_key:
      user: "{{ bastion_user }}"
      key: "{{ bastion_user_public_key }}"
      exclusive: true

- name: Install the support for deb822 repositories
  ansible.builtin.apt:
      name: python3-debian
      state: present

- name: Add the Kubernetes package repository for the cluster's minor version
  ansible.builtin.deb822_repository:
      name: kubernetes
      types: deb
      uris: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_minor }}/deb/"
      suites: /
      signed_by: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_minor }}/deb/Release.key"
  register: kubernetes_repository

- name: Install kubectl
  ansible.builtin.apt:
      name: kubectl
      state: present
      update_cache: "{{ kubernetes_repository.changed }}"

- name: Install git, so kubectl can apply Kustomize directories straight from GitHub
  ansible.builtin.apt:
      name: git
      state: present

- name: Create the kubeseal directory for this version
  ansible.builtin.file:
      path: "/opt/kubeseal-{{ kubeseal_version }}"
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Download kubeseal and check its SHA256
  ansible.builtin.get_url:
      url: "https://github.com/bitnami-labs/sealed-secrets/releases/download/v{{ kubeseal_version }}/kubeseal-{{ kubeseal_version }}-linux-amd64.tar.gz"
      dest: "/opt/kubeseal-{{ kubeseal_version }}/kubeseal.tar.gz"
      checksum: "sha256:{{ kubeseal_sha256 }}"
      owner: root
      group: root
      mode: "0644"

- name: Extract kubeseal
  ansible.builtin.unarchive:
      src: "/opt/kubeseal-{{ kubeseal_version }}/kubeseal.tar.gz"
      dest: "/opt/kubeseal-{{ kubeseal_version }}"
      remote_src: true
      include: [kubeseal]
      creates: "/opt/kubeseal-{{ kubeseal_version }}/kubeseal"
      owner: root
      group: root

- name: Put this kubeseal version on the PATH
  ansible.builtin.file:
      src: "/opt/kubeseal-{{ kubeseal_version }}/kubeseal"
      dest: /usr/local/bin/kubeseal
      state: link

- name: Read the kubeconfig from the cluster node
  ansible.builtin.slurp:
      src: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ bastion_cluster_node }}"
  register: cluster_kubeconfig
  no_log: true

- name: Create the operator's kubeconfig directory
  ansible.builtin.file:
      path: "{{ bastion_user_account.home }}/.kube"
      state: directory
      owner: "{{ bastion_user }}"
      group: "{{ bastion_user }}"
      mode: "0700"

- name: Write the operator's kubeconfig
  ansible.builtin.copy:
      content: "{{ cluster_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ hostvars[bastion_cluster_node].ansible_host ~ ':6443') }}"
      dest: "{{ bastion_user_account.home }}/.kube/config"
      owner: "{{ bastion_user }}"
      group: "{{ bastion_user }}"
      mode: "0600"
  no_log: true
