- name: Create the k3s config directory
  ansible.builtin.file:
      path: /etc/rancher/k3s
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Write the k3s config
  ansible.builtin.copy:
      dest: /etc/rancher/k3s/config.yaml
      content: |
          write-kubeconfig-mode: "0600"
          tls-san:
            - {{ ansible_host }}
      owner: root
      group: root
      mode: "0600"
  notify: Restart k3s

- name: Read the installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Download the k3s install script for this version
  ansible.builtin.get_url:
      url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
      dest: /usr/local/bin/k3s-install.sh
      owner: root
      group: root
      mode: "0755"

- name: Install k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
      INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in k3s_installed.stdout | default('')

- name: Read the kubeconfig generated by k3s
  ansible.builtin.slurp:
      src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig
  no_log: true

- name: Create the kubeconfig directory on the control node
  ansible.builtin.file:
      path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
      state: directory
      mode: "0700"
  delegate_to: localhost
  become: false

- name: Write the kubeconfig on the control node
  ansible.builtin.copy:
      content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443') }}"
      dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/{{ inventory_hostname }}.yaml"
      mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
