        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/lab_ansible
    children:
        k3s_servers:
            hosts:
                lab-vm:
                    ansible_host: 192.168.100.10
        bastions:
            hosts:
                lab-bastion:
                    ansible_host: 192.168.100.5
                    vm_cpus: 2
                    vm_memory_gb: 2
